name: CI

on:
  push:
    branches: [main]
    tags: ["phase-*", "v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run parry version
          uv run parry targets check -c parry.example.yaml --i-own-this-target vuln-rag
          ! uv run parry targets check -c parry.example.yaml
