repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Result files are kept byte-identical to what the runs wrote.
      - id: trailing-whitespace
        exclude: ^evals/results/
      - id: end-of-file-fixer
        exclude: ^evals/results/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
  - repo: local
    hooks:
      # Real-tokenizer chunking test; runs only when the chunking code changes. Skips if the
      # tokenizers are not cached locally.
      - id: chunking-real-tokenizers
        name: chunking (real tokenizers)
        entry: uv run pytest -q tests/test_chunking_real.py
        language: system
        pass_filenames: false
        files: ^(parry/classifier/chunking\.py|tests/test_chunking_real\.py)$
