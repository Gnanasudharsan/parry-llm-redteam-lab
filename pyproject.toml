[project]
name = "parry"
version = "0.0.1"
description = "Red-team and guardrails lab for LLM apps and agents: repeatable attack suites, measured defenses, OWASP LLM Top 10 and MITRE ATLAS mapping."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gnanasudharsan Ashokumar" }]
keywords = ["ai-security", "llm-security", "red-teaming", "prompt-injection", "guardrails"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "anyio>=4",
    "httpx>=0.28.1",
    "mcp>=2.3",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.4",
    "typer>=0.29",
]

[project.scripts]
parry = "parry.cli.app:app"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12",
]
lab = [
    "fastapi>=0.165",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.2",
    "langgraph>=1.2.24",
    "numpy>=2.5",
    "uvicorn>=0.54",
]
ml = [
    "mlflow>=3.18.0",
    "pyarrow>=26.0.1",
    "sentencepiece>=0.2.3",
    "torch>=2.15",
    "transformers>=5.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parry"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = ["B008"] # Typer declares options as call defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"parry/reporting/pareto.py" = ["E501"]  # inline SVG markup templates

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["parry", "targets", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MCPServer.custom_route is not typed in the SDK.
module = "targets.mcp_server.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
