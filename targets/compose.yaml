# Parry lab: make targets-up. Targets and the mock web/exfiltration recorder live on an
# internal network with no internet route; lab-gateway is the single way in and out.
name: parry-lab

x-env: &env
  OLLAMA_BASE_URL: http://lab-gateway:11434
  GUARD_URL: http://lab-gateway:8300
  LAB_SEED: ${LAB_SEED:-parry-lab-1337}
  LAB_MODEL_SEED: ${LAB_MODEL_SEED:-1337}
  LAB_CHAT_MODEL: ${LAB_CHAT_MODEL:-qwen2.5:7b-instruct}
  LAB_EMBED_MODEL: ${LAB_EMBED_MODEL:-nomic-embed-text}
  LAB_ADMIN_TOKEN: ${LAB_ADMIN_TOKEN:-parry-lab-admin}
  MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*
  PORT: "8000"

x-target: &target
  image: parry-lab:local  # built once by mockweb, reused by every target
  pull_policy: never
  networks: [lab]
  depends_on: [lab-gateway, mockweb]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 5s
    timeout: 4s
    retries: 30
    start_period: 10s

services:
  lab-gateway:
    image: nginx:1.29-alpine
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [lab, egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:8101:8101"
      - "127.0.0.1:8102:8102"
      - "127.0.0.1:8111:8111"
      - "127.0.0.1:8112:8112"
      - "127.0.0.1:8121:8121"
      - "127.0.0.1:8122:8122"
      - "127.0.0.1:8199:8199"
    restart: unless-stopped

  mockweb:
    <<: *target
    build: { context: .., dockerfile: targets/Dockerfile }
    pull_policy: build
    depends_on: [lab-gateway]
    # Listens on port 80 so lab URLs look like real ones (http://attacker.test/...).
    command: ["uvicorn", "targets.mockweb.app:app", "--host", "0.0.0.0", "--port", "80"]
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    environment: { <<: *env }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    networks:
      lab:
        aliases: [harborview.test, docs.harborview.test, backup.harborview.test, attacker.test]

  vuln-rag:
    <<: *target
    command: ["python", "-m", "targets.rag.app"]
    environment: { <<: *env, PROFILE: vulnerable }
  hard-rag:
    <<: *target
    command: ["python", "-m", "targets.rag.app"]
    environment: { <<: *env, PROFILE: hardened }

  vuln-agent:
    <<: *target
    command: ["python", "-m", "targets.agent.app"]
    environment: { <<: *env, PROFILE: vulnerable }
  hard-agent:
    <<: *target
    command: ["python", "-m", "targets.agent.app"]
    environment: { <<: *env, PROFILE: hardened }

  vuln-mcp:
    <<: *target
    command: ["python", "-m", "targets.mcp_server.server"]
    environment: { <<: *env, PROFILE: vulnerable }
  hard-mcp:
    <<: *target
    command: ["python", "-m", "targets.mcp_server.server"]
    environment: { <<: *env, PROFILE: hardened }

networks:
  lab:
    internal: true
  egress: {}
