# The only lab container with a route off the internal network.
#  - Ingress: publishes each target on 127.0.0.1 (see compose ports).
#  - Egress: forwards the model API to Ollama on the host, and nothing else.
worker_processes 1;
events { worker_connections 256; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;  # Docker DNS; resolve per request
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  client_max_body_size 4m;
  proxy_set_header Host $http_host;
  proxy_set_header Connection "";
  access_log /dev/stdout;

  server { listen 8101; location / { set $u http://vuln-rag:8000;   proxy_pass $u; } }
  server { listen 8102; location / { set $u http://hard-rag:8000;   proxy_pass $u; } }
  server { listen 8111; location / { set $u http://vuln-agent:8000; proxy_pass $u; } }
  server { listen 8112; location / { set $u http://hard-agent:8000; proxy_pass $u; } }
  server { listen 8121; location / { set $u http://vuln-mcp:8000;   proxy_pass $u; } }
  server { listen 8122; location / { set $u http://hard-mcp:8000;   proxy_pass $u; } }
  server { listen 8199; location / { set $u http://mockweb:80;      proxy_pass $u; } }

  # Model API for lab containers only (not published to the host).
  server {
    listen 11434;
    location / {
      proxy_pass http://host.docker.internal:11434;
      proxy_set_header Host localhost:11434;
    }
  }
}
